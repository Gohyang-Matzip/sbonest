name: Docs

# Builds the documentation site from docs/ with MkDocs; pushes to main publish it to GitHub Pages.
on:
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "scripts/docs_hooks.py", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "scripts/docs_hooks.py", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install mkdocs
      - run: mkdocs build --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
