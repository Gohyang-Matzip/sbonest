name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  MPLBACKEND: Agg

jobs:
  checks:
    name: checks ${{ matrix.shard }} (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        shard: [core, analysis, tools]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-sideband.txt -c constraints-sideband.txt ruff
      - run: ruff check *.py tests scripts --select F
      - run: python -m py_compile *.py tests/*.py scripts/*.py
      - run: python scripts/generate_api_reference.py --check
      - name: Core numerics and inherited ONEST checks
        if: matrix.shard == 'core'
        run: |
          python tests/test_performance.py
          python tests/test_debugging.py
          python tests/verify_3state.py
          python tests/test_sideband.py
          python tests/test_grouped_jacobian.py
          python tests/test_benchmark.py
          python tests/test_sb_check.py
          python tests/test_sb_checkpoint.py
          python tests/test_sb_models.py
      - name: Analysis checks
        if: matrix.shard == 'analysis'
        run: |
          python tests/test_sb_analysis.py
          python tests/test_profile_jacobian.py
          python tests/test_sb_bootstrap.py
          python tests/test_uncertainty_validation.py
          python tests/test_sb_parallel.py
          python tests/test_profile_interval.py
          python tests/test_sb_diagnostics.py
      - name: Workflow tool checks
        if: matrix.shard == 'tools'
        run: |
          python tests/test_sb_workflow.py
          python tests/test_sb_design.py
          python tests/test_sb_compare.py
          python tests/test_sb_import.py
          python tests/test_sb_server.py
          python tests/test_sb_cli.py

  workflow:
    name: full fit, demo and dummy guide (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-sideband.txt -c constraints-sideband.txt build twine
      - name: Install the package and run the console command
        run: |
          python -m pip install -e . -c constraints-sideband.txt
          sbonest version
          sbonest check example/sideband_auto_H/two_RF.json --no-pdf
      - run: python tests/test_sb_output.py
      - name: Canonical historical golden and exact worker identity
        shell: bash
        run: |
          mkdir -p .omo/evidence/task-8
          python tests/test_sb_golden.py --out .omo/evidence/task-8/ci_golden 2>&1 | tee .omo/evidence/task-8/golden.log
      - name: Noneditable wheel and sdist acceptance
        shell: bash
        run: python tests/test_sb_distribution.py --out .omo/evidence/task-8/ci_distribution 2>&1 | tee .omo/evidence/task-8/distribution.log
      - run: python scripts/demo_sideband.py --out session_artifacts/ci_sideband_demo
      - name: Run the dummy-guide workflow with two workers
        run: |
          python sb_workflow.py init-demo --out session_artifacts/ci_guide
          python run.py session_artifacts/ci_guide/fit.json --check --identifiability --no-pdf
          python run.py session_artifacts/ci_guide/fit.json --no-pdf --workers 2
          python run.py session_artifacts/ci_guide/fit.json --no-pdf --resume
          python sb_workflow.py report session_artifacts/ci_guide/fit_result.json --out session_artifacts/ci_guide/report
      - name: Retain acceptance failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-failure-python-3.12
          include-hidden-files: true
          path: |
            .omo/evidence/task-8/*.log
            .omo/evidence/task-8/ci_golden/**
            .omo/evidence/task-8/ci_distribution/manifest.json
            .omo/evidence/task-8/ci_distribution/*.log
          if-no-files-found: warn
