name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  MPLBACKEND: Agg

jobs:
  checks:
    name: checks ${{ matrix.shard }} (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        shard: [core, analysis, tools]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-sideband.txt -c constraints-sideband.txt ruff
      - run: ruff check *.py --select F
      - run: python -m py_compile *.py
      - run: python generate_api_reference.py --check
      - name: Core numerics and inherited ONEST checks
        if: matrix.shard == 'core'
        run: |
          python test_performance.py
          python test_debugging.py
          python verify_3state.py
          python test_sideband.py
          python test_grouped_jacobian.py
          python test_benchmark.py
          python test_sb_check.py
          python test_sb_checkpoint.py
          python test_sb_models.py
      - name: Analysis checks
        if: matrix.shard == 'analysis'
        run: |
          python test_sb_analysis.py
          python test_profile_jacobian.py
          python test_sb_bootstrap.py
          python test_uncertainty_validation.py
          python test_sb_parallel.py
          python test_profile_interval.py
          python test_sb_diagnostics.py
      - name: Workflow tool checks
        if: matrix.shard == 'tools'
        run: |
          python test_sb_workflow.py
          python test_sb_design.py
          python test_sb_compare.py
          python test_sb_import.py
          python test_sb_server.py
          python test_sb_cli.py

  workflow:
    name: full fit, demo and dummy guide (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-sideband.txt -c constraints-sideband.txt
      - name: Install the package and run the console command
        run: |
          python -m pip install -e . -c constraints-sideband.txt
          sbonest version
          sbonest check example/sideband_auto_H/two_RF.json --no-pdf
      - run: python test_sb_output.py
      - run: python demo_sideband.py --out session_artifacts/ci_sideband_demo
      - name: Run the dummy-guide workflow with two workers
        run: |
          python sb_workflow.py init-demo --out session_artifacts/ci_guide
          python run.py session_artifacts/ci_guide/fit.json --check --identifiability --no-pdf
          python run.py session_artifacts/ci_guide/fit.json --no-pdf --workers 2
          python run.py session_artifacts/ci_guide/fit.json --no-pdf --resume
          python sb_workflow.py report session_artifacts/ci_guide/fit_result.json --out session_artifacts/ci_guide/report
