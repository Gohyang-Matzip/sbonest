name: Release

# Pushing a tag vX.Y.Z publishes a GitHub release with the wheel, the sdist and
# that version's CHANGELOG section, and the container image on ghcr.io. The tag
# must match pyproject.toml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: Tag, pyproject.toml, CITATION.cff and CHANGELOG.md agree
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python - "$version" <<'PY'
          import re, sys, tomllib
          version = sys.argv[1]
          assert tomllib.load(open('pyproject.toml', 'rb'))['project']['version'] == version, 'pyproject.toml'
          assert re.search(rf'^version: {re.escape(version)}$', open('CITATION.cff').read(), re.M), 'CITATION.cff'
          PY
          awk -v v="$version" '/^## /{on = ($2 == v)} on' CHANGELOG.md | tail -n +2 > notes.md
          test -s notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "SBONEST ${{ steps.version.outputs.version }}" --notes-file notes.md --verify-tag
      - name: Publish the container image
        env:
          IMAGE: ghcr.io/gohyang-matzip/sbonest
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
          docker run --rm "$IMAGE:$VERSION" version
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
